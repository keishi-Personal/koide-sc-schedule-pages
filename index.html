<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小出SC予定表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
  :root {
    --ink: #1e2420;
    --ink-soft: #4a534c;
    --bg: #f6f4ee;
    --surface: #ffffff;
    --surface-sunken: #eeece3;
    --border: #ddd8c9;
    --brand: #1f5c40;
    --brand-ink: #ffffff;
    --team-a: #2461b3;
    --team-a-soft: #e1ebf8;
    --team-b: #d6478f;
    --team-b-soft: #fbe6f1;
    --att-yes: #3f9142;
    --att-no: #b3392c;
    --att-maybe: #7c827a;
    --att-none: #b7bcb4;
    --badge-a: #1d4e8c;
    --badge-b: #ad2570;
    --shadow: 0 1px 2px rgba(30,36,32,0.06), 0 4px 14px rgba(30,36,32,0.06);
    --radius-card: 14px;
    --radius-chip: 999px;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #eef1ec;
      --ink-soft: #b7bfb6;
      --bg: #12160f;
      --surface: #1b2018;
      --surface-sunken: #232a1f;
      --border: #333b2d;
      --brand: #7fcaa0;
      --brand-ink: #0c1620;
      --team-a: #6fa8e8;
      --team-a-soft: #1c2a3d;
      --team-b: #f2a0c8;
      --team-b-soft: #3d2030;
      --att-yes: #6fbf72;
      --att-no: #e0776a;
      --att-maybe: #a8afa4;
      --att-none: #565f52;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --ink: #eef1ec;
    --ink-soft: #b7bfb6;
    --bg: #12160f;
    --surface: #1b2018;
    --surface-sunken: #232a1f;
    --border: #333b2d;
    --brand: #7fcaa0;
    --brand-ink: #0c1620;
    --team-a: #6fa8e8;
    --team-a-soft: #1c2a3d;
    --team-b: #f2a0c8;
    --team-b-soft: #3d2030;
    --att-yes: #6fbf72;
    --att-no: #e0776a;
    --att-maybe: #a8afa4;
    --att-none: #565f52;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 40px;
  }

  .shell {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 14px;
  }

  header.top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--brand);
    color: var(--brand-ink);
    padding: 14px 16px 12px;
    box-shadow: var(--shadow);
  }

  header.top .row1 {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  header.top h1 {
    font-family: 'Oswald', 'Noto Sans JP', sans-serif;
    font-weight: 700;
    font-size: 21px;
    letter-spacing: 0.02em;
    margin: 0;
  }

  header.top .row1-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  header.top .note-view-btn {
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--brand-ink) 40%, transparent);
    background: color-mix(in srgb, var(--brand-ink) 12%, transparent);
    color: var(--brand-ink);
    cursor: pointer;
    white-space: nowrap;
  }

  header.top .note-view-btn:active { opacity: 0.7; }

  header.top .updated {
    font-size: 11px;
    opacity: 0.75;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }

  .tab-btn {
    flex: 1;
    appearance: none;
    border: 1px solid rgba(255,255,255,0.35);
    background: transparent;
    color: var(--brand-ink);
    padding: 8px 10px;
    border-radius: 10px;
    font: inherit;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .tab-btn[aria-selected="true"] {
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.7);
    font-weight: 700;
  }

  .filters {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .chip {
    appearance: none;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    padding: 5px 12px;
    border-radius: var(--radius-chip);
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chip[aria-pressed="true"] { color: var(--ink); border-color: currentColor; }
  .chip[data-team="A"][aria-pressed="true"] { color: var(--team-a); background: var(--team-a-soft); border-color: var(--team-a); }
  .chip[data-team="B"][aria-pressed="true"] { color: var(--team-b); background: var(--team-b-soft); border-color: var(--team-b); }
  .chip[data-team="both"][aria-pressed="true"] { color: var(--brand); border-color: var(--brand); background: var(--surface-sunken); }
  .chip-jump { margin-left: auto; }
  .chip-jump[hidden] { display: none; }

  main { padding-top: 14px; }

  /* ---------- List view ---------- */
  .year-heading {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin: 22px 2px 6px;
    scroll-margin-top: 178px;
  }
  .month-heading {
    font-weight: 700;
    font-size: 16px;
    margin: 14px 2px 8px;
    display: flex;
    align-items: baseline;
    gap: 6px;
    scroll-margin-top: 178px;
  }
  .month-heading .num {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    color: var(--brand);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 5px solid var(--team-a);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow);
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .card.team-B { border-left-color: var(--team-b); }

  .card-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .card-date {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--ink-soft);
    min-width: 64px;
    line-height: 1.35;
    font-variant-numeric: tabular-nums;
  }
  .card-date .dow { font-size: 11px; opacity: 0.8; }
  .card-body { flex: 1; min-width: 0; }
  .card-title-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .team-badge {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: var(--radius-chip);
    color: #fff;
    background: var(--badge-a);
    letter-spacing: 0.03em;
  }
  .team-badge.B { background: var(--badge-b); }
  .card-title { font-weight: 700; font-size: 15.5px; }
  .card-time { font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .card-loc { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .card-meet { font-size: 12.5px; color: var(--brand); font-weight: 700; margin-top: 2px; }
  .card-desc {
    font-size: 13px;
    color: var(--ink);
    margin-top: 8px;
    white-space: pre-line;
    line-height: 1.5;
    background: var(--surface-sunken);
    border-radius: 8px;
    padding: 8px 10px;
  }

  .attend-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .attend-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    padding: 3px 8px 3px 6px;
    border-radius: var(--radius-chip);
    background: var(--surface-sunken);
    color: var(--ink);
  }
  .attend-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .attend-empty { font-size: 12px; color: var(--ink-soft); font-style: normal; }

  /* ---------- List view: compact table rows ---------- */
  .month-table {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 14px;
  }
  .row-item.day-end .row-summary { border-bottom: 1px solid var(--border); }
  .month-table .row-item:last-child .row-summary { border-bottom: none; }
  .row-item.open .row-summary { background: var(--surface-sunken); }
  .row-item.same-day .row-summary { padding-top: 3px; }
  .row-summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .row-summary:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
  .row-date {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    color: var(--ink-soft);
    min-width: 52px;
    flex: none;
    font-variant-numeric: tabular-nums;
    line-height: 1.3;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-title {
    font-weight: 700;
    font-size: 13.5px;
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
  }
  .row-time { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; margin-top: 1px; }
  .row-meet { color: var(--brand); font-weight: 700; }
  .row-att {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
    font-size: 11px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: right;
    min-width: 44px;
  }
  .att-count.yes { color: var(--att-yes); }
  .att-count.no { color: var(--att-no); }
  .att-count.maybe { color: var(--att-maybe); }
  .row-chev {
    flex: none;
    width: 14px;
    text-align: center;
    color: var(--ink-soft);
    transition: transform 0.15s ease;
  }
  .row-item.open .row-chev { transform: rotate(90deg); }
  .row-detail { padding: 2px 12px 12px 70px; }
  .row-detail .card-loc, .row-detail .card-meet, .row-detail .card-desc { margin-top: 6px; }
  .row-detail .attend-row { margin-top: 8px; }

  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    padding: 60px 20px;
    font-size: 14px;
  }

  /* ---------- Calendar view ---------- */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 4px 0 10px;
  }
  .cal-nav button {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    width: 34px; height: 34px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
  }
  .cal-nav .month-label {
    font-family: 'Oswald', sans-serif;
    font-size: 19px;
    font-weight: 600;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 8px;
    box-shadow: var(--shadow);
  }
  .cal-dow {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 700;
    padding-bottom: 4px;
  }
  .cal-cell {
    aspect-ratio: 1 / 1;
    border-radius: 9px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 4px;
    gap: 3px;
    cursor: pointer;
    border: 1px solid transparent;
    background: transparent;
    font: inherit;
    color: inherit;
  }
  .cal-cell.pad { visibility: hidden; cursor: default; }
  .cal-cell .n { font-family: 'Oswald', sans-serif; font-size: 14px; font-variant-numeric: tabular-nums; }
  .cal-cell.today { background: var(--surface-sunken); }
  .cal-cell.today .n { color: var(--brand); font-weight: 700; }
  .cal-cell.selected { border-color: var(--brand); }
  .cal-dots { display: flex; gap: 2px; }
  .cal-dots .dot { width: 6px; height: 6px; border-radius: 50%; }

  .cal-cell .note-mark { width: 14px; height: 3px; border-radius: 2px; background: var(--brand); margin-top: 1px; }

  .note-box {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius-card);
    padding: 12px 14px;
    margin: 14px 0 4px;
  }
  .note-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .note-input {
    width: 100%;
    min-height: 44px;
    resize: vertical;
    font: inherit;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .note-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
  }
  .note-save {
    appearance: none;
    border: none;
    background: var(--brand);
    color: var(--brand-ink);
    font: inherit;
    font-weight: 700;
    font-size: 13px;
    padding: 7px 16px;
    border-radius: var(--radius-chip);
    cursor: pointer;
  }
  .note-status { font-size: 12px; color: var(--ink-soft); }
  .note-unavailable { font-size: 12px; color: var(--ink-soft); font-style: italic; }
  .note-readonly-text { font-size: 13.5px; color: var(--ink); white-space: pre-wrap; line-height: 1.5; }

  /* ---------- Note list modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,14,10,0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-panel {
    background: var(--surface);
    width: 100%;
    max-width: 720px;
    max-height: 78vh;
    overflow-y: auto;
    border-radius: 16px 16px 0 0;
    padding: 14px 16px 20px;
    box-shadow: var(--shadow);
  }
  @media (min-width: 760px) {
    .modal-overlay { align-items: center; padding: 20px; }
    .modal-panel { border-radius: var(--radius-card); max-height: 70vh; }
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    position: sticky;
    top: 0;
    background: var(--surface);
    padding-top: 2px;
  }
  .modal-head h2 {
    font-family: 'Oswald', 'Noto Sans JP', sans-serif;
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    color: var(--ink);
  }
  .modal-close {
    appearance: none;
    border: none;
    background: var(--surface-sunken);
    color: var(--ink-soft);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .note-list-item {
    padding: 10px 2px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .note-list-item:last-child { border-bottom: none; }
  .note-list-item:active { background: var(--surface-sunken); }
  .note-list-date {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--brand);
    margin-bottom: 3px;
  }
  .note-list-text {
    font-size: 13.5px;
    color: var(--ink);
    white-space: pre-line;
    line-height: 1.5;
  }
  .note-list-empty {
    text-align: center;
    color: var(--ink-soft);
    padding: 34px 10px;
    font-size: 13px;
  }

  .agenda-heading {
    font-weight: 700;
    font-size: 15px;
    margin: 18px 2px 8px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .agenda-heading .num { font-family:'Oswald', sans-serif; color: var(--brand); font-size: 19px; }

  footer.note {
    max-width: 720px;
    margin: 30px auto 0;
    padding: 0 16px;
    font-size: 11.5px;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>


<div class="shell">
  <header class="top">
    <div class="row1">
      <h1>小出SC予定表</h1>
      <div class="row1-right">
        <span class="updated" id="updatedAt"></span>
        <button class="note-view-btn" id="noteViewBtn">📌 メモ確認</button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab-btn" id="tabList" role="tab" aria-selected="true">リスト</button>
      <button class="tab-btn" id="tabCal" role="tab" aria-selected="false">カレンダー</button>
    </div>
    <div class="filters" id="teamFilters">
      <button class="chip" data-team="both" aria-pressed="true">両方</button>
      <button class="chip" data-team="A" aria-pressed="false"><span class="dot" style="background:var(--team-a)"></span>Aチーム</button>
      <button class="chip" data-team="B" aria-pressed="false"><span class="dot" style="background:var(--team-b)"></span>Bチーム</button>
      <button class="chip chip-jump" id="jumpTodayBtn" aria-pressed="false">📅 今月へ</button>
    </div>
  </header>

  <main>
    <section id="viewList"></section>
    <section id="viewCal" hidden>
      <div class="cal-nav">
        <button id="calPrev" aria-label="前の月">‹</button>
        <span class="month-label" id="calLabel"></span>
        <button id="calNext" aria-label="次の月">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div id="calAgenda"></div>
    </section>
  </main>

  <footer class="note">
    小出SCのサークルスクエア（A/B両アカウント）から取得した予定・コーチ出欠を表示しています。表示対象はサークルスクエアに登録済みの期間のみです。カレンダー画面の日付をタップすると、家庭用の個人メモ（サークルスクエアとは別データ）も1日1件登録できます。最新の予定を反映したいときは、Claudeとの会話で「更新して」と伝えてください。
  </footer>
</div>

<div class="modal-overlay" id="noteModalOverlay" hidden>
  <div class="modal-panel">
    <div class="modal-head">
      <h2>📌 個人メモ一覧</h2>
      <button class="modal-close" id="noteModalClose" aria-label="閉じる">✕</button>
    </div>
    <div id="noteModalList"></div>
  </div>

  }
  function addDays(date, n){ const d = new Date(date); d.setDate(d.getDate()+n); return d; }
  function ymd(date){ return `${date.getFullYear()}-${pad2(date.getMonth()+1)}-${pad2(date.getDate())}`; }
  const DOW = ['日','月','火','水','木','金','土'];

  // Precompute normalized event objects
  const items = EVENTS.map(e => {
    const start = parseLocal(e.start);
    let end = e.end ? parseLocal(e.end) : start;
    if (e.allDay) end = addDays(end, -1); // iCal DTEND is exclusive
    return { ...e, startDate: start, endDate: end };
  }).sort((a,b) => {
    // Same day: always Aチーム before Bチーム, regardless of time. Otherwise, chronological.
    const dayA = ymd(a.startDate), dayB = ymd(b.startDate);
    if (dayA !== dayB) return a.startDate - b.startDate;
    if (a.team !== b.team) return a.team === 'A' ? -1 : 1;
    return a.startDate - b.startDate;
  });

  function fiscalYear(date){
    // April(4) start
    const y = date.getFullYear();
    return date.getMonth() >= 3 ? y : y - 1;
  }

  function eventsOnDay(date){
    const key = ymd(date);
    return items.filter(e => ymd(e.startDate) <= key && key <= ymd(e.endDate));
  }

  function fmtDateRange(e){
    const s = e.startDate, en = e.endDate;
    const sStr = `${s.getMonth()+1}/${s.getDate()}(${DOW[s.getDay()]})`;
    if (e.allDay){
      if (ymd(s) === ymd(en)) return sStr;
      const enStr = `${en.getMonth()+1}/${en.getDate()}(${DOW[en.getDay()]})`;
      return `${sStr}〜${enStr}`;
    }
    const time = `${pad2(s.getHours())}:${pad2(s.getMinutes())}`;
    const endTime = en ? `${pad2(en.getHours())}:${pad2(en.getMinutes())}` : '';
    return { sStr, time, endTime };
  }

  function attendRowHtml(list){
    if (!list || list.length === 0) return '<span class="attend-empty">出欠情報なし</span>';
    return list.map(p => {
      const color = ATT_COLOR[p.status] || 'var(--att-none)';
      return `<span class="attend-pill"><span class="dot" style="background:${color}"></span>${escapeHtml(p.name)} ${escapeHtml(p.status)}</span>`;
    }).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function attendSummary(list){
    if (!list || list.length === 0) return '<span class="attend-empty">—</span>';
    const counts = { yes: 0, no: 0, maybe: 0 };
    list.forEach(p => {
      if (p.status === '参加') counts.yes++;
      else if (p.status === '不参加') counts.no++;
      else if (p.status === '未定/その他' || p.status === 'キャンセル待ち') counts.maybe++;
    });
    const parts = [];
    if (counts.yes) parts.push(`<span class="att-count yes">参加${counts.yes}</span>`);
    if (counts.no) parts.push(`<span class="att-count no">不参加${counts.no}</span>`);
    if (counts.maybe) parts.push(`<span class="att-count maybe">未定${counts.maybe}</span>`);
    if (parts.length === 0) return '<span class="attend-empty">—</span>';
    return parts.join('');
  }

  function extractMeetTimes(e){
    const times = [];
    const seen = new Set();
    const add = (t) => {
      if (!t) return;
      const norm = t.replace(/^0(\d:)/, '$1'); // "09:30" -> "9:30" で重複判定を揃える
      if (seen.has(norm)) return;
      seen.add(norm);
      times.push(norm);
    };
    // サークルスクエアの「集合日時」専用フィールド（構造化データ）を優先的に採用
    add(e.meetTime);
    // 説明文中に埋め込まれた「HH:MM集合」表記も拾う（構造化フィールドが無い予定用）
    const desc = e.description;
    if (desc) {
      const re = /(\d{1,2}:\d{2})\s*集合/g;
      let m;
      while ((m = re.exec(desc))) add(m[1]);
    }
    return times;
  }

  function rowHtml(e, opts){
    opts = opts || {};
    const dateInfo = fmtDateRange(e);
    let dateBlock, timeBlock;
    if (e.allDay){
      dateBlock = typeof dateInfo === 'string' ? dateInfo : '';
      timeBlock = '終日';
    } else {
      dateBlock = dateInfo.sStr;
      timeBlock = dateInfo.endTime ? `${dateInfo.time}〜${dateInfo.endTime}` : dateInfo.time;
    }
    const meetTimes = extractMeetTimes(e);
    if (meetTimes.length) timeBlock += ` <span class="row-meet">・集合 ${meetTimes.join('/')}</span>`;
    const dateCell = opts.sameAsPrev ? '' : dateBlock;
    const rowClasses = ['row-item'];
    if (opts.sameAsPrev) rowClasses.push('same-day');
    if (!opts.sameAsNext) rowClasses.push('day-end');
    return `
      <div class="${rowClasses.join(' ')}" data-id="${e.id}">
        <div class="row-summary" role="button" tabindex="0" aria-expanded="false">
          <div class="row-date">${dateCell}</div>
          <span class="team-badge ${e.team}">${TEAM_LABEL[e.team]}</span>
          <div class="row-main">
            <div class="row-title">${escapeHtml(e.title)}</div>
            <div class="row-time">${timeBlock}</div>
          </div>
          <div class="row-att">${attendSummary(e.coachAttendance)}</div>
          <span class="row-chev">›</span>
        </div>
        <div class="row-detail" hidden>
          ${e.location ? `<div class="card-loc">📍 ${escapeHtml(e.location)}</div>` : ''}
          ${e.description ? `<div class="card-desc">${escapeHtml(e.description)}</div>` : ''}
          <div class="attend-row">${attendRowHtml(e.coachAttendance)}</div>
        </div>
      </div>`;
  }

  function cardHtml(e){
    const dateInfo = fmtDateRange(e);
    let dateBlock, timeBlock;
    if (e.allDay){
      dateBlock = typeof dateInfo === 'string' ? dateInfo : '';
      timeBlock = '終日';
    } else {
      dateBlock = dateInfo.sStr;
      timeBlock = dateInfo.endTime ? `${dateInfo.time}〜${dateInfo.endTime}` : dateInfo.time;
    }
    return `
      <div class="card team-${e.team}">
        <div class="card-head">
          <div class="card-date">${dateBlock}</div>
          <div class="card-body">
            <div class="card-title-row">
              <span class="team-badge ${e.team}">${TEAM_LABEL[e.team]}</span>
              <span class="card-title">${escapeHtml(e.title)}</span>
            </div>
            <div class="card-time">${timeBlock}</div>
            ${e.location ? `<div class="card-loc">📍 ${escapeHtml(e.location)}</div>` : ''}
            ${e.meetTime ? `<div class="card-meet">🕒 集合 ${escapeHtml(e.meetTime)}${e.meetPlace ? `（${escapeHtml(e.meetPlace)}）` : ''}</div>` : ''}
            ${e.description ? `<div class="card-desc">${escapeHtml(e.description)}</div>` : ''}
            <div class="attend-row">${attendRowHtml(e.coachAttendance)}</div>
          </div>
        </div>
      </div>`;
  }

  // ---------------- personal notes (db capability) ----------------
  let notesMap = {};
  let dbReady = null; // null = unknown yet, false = unavailable, true = available
  let dbInstance = null;
  let dbPromise = null;
  function getDb(){
    if (!dbPromise){
      dbPromise = (async () => {
        try {
          if (!window.claude || !window.claude.use) { dbReady = false; return null; }
          const db = await window.claude.use('db');
          dbInstance = db;
          dbReady = !!db;
          return db;
        } catch(e) { dbReady = false; return null; }
      })();
    }
    return dbPromise;
  }
  (async () => {
    const db = await getDb();
    if (!db) { dbReady = false; return; }
    try {
      db.collection('notes').onSnapshot(snap => {
        const next = {};
        snap.docs.forEach(doc => { next[doc.id] = (doc.data() || {}).text || ''; });
        notesMap = next;
        if (state.view === 'cal') { renderCalGrid(); renderAgenda(); }
        const overlay = document.getElementById('noteModalOverlay');
        if (overlay && !overlay.hidden) renderNoteModalList();
      });
    } catch(e) { dbReady = false; }
  })();

  // ---------------- note list modal（メモ確認） ----------------
  function sortedNoteEntries(){
    const source = dbReady === false ? (STATIC_NOTES || {}) : notesMap;
    return Object.keys(source)
      .filter(k => source[k] && source[k].trim())
      .sort()
      .map(k => ({ dateKey: k, text: source[k] }));
  }
  function noteEntryDateLabel(dateKey){
    const [y,m,d] = dateKey.split('-').map(Number);
    const date = new Date(y, m-1, d);
    return `${y}/${m}/${d}(${DOW[date.getDay()]})`;
  }
  function renderNoteModalList(){
    const el = document.getElementById('noteModalList');
    const entries = sortedNoteEntries();
    if (entries.length === 0){
      el.innerHTML = '<div class="note-list-empty">登録されている個人メモはありません。</div>';
      return;
    }
    el.innerHTML = entries.map(n => `
      <div class="note-list-item" data-date="${n.dateKey}">
        <div class="note-list-date">${noteEntryDateLabel(n.dateKey)}</div>
        <div class="note-list-text">${escapeHtml(n.text)}</div>
      </div>
    `).join('');
    el.querySelectorAll('.note-list-item').forEach(item => {
      item.addEventListener('click', () => {
        const dateKey = item.dataset.date;
        closeNoteModal();
        goToDateInCalendar(dateKey);
      });
    });
  }
  function goToDateInCalendar(dateKey){
    const [y,m,d] = dateKey.split('-').map(Number);
    state.calYear = y;
    state.calMonth = m - 1;
    state.selectedDate = dateKey;
    setView('cal');
  }
  function openNoteModal(){
    renderNoteModalList();
    document.getElementById('noteModalOverlay').hidden = false;
  }
  function closeNoteModal(){
    document.getElementById('noteModalOverlay').hidden = true;
  }
  function wireNoteModal(){
    const btn = document.getElementById('noteViewBtn');
    if (btn) btn.addEventListener('click', openNoteModal);
    const closeBtn = document.getElementById('noteModalClose');
    if (closeBtn) closeBtn.addEventListener('click', closeNoteModal);
    const overlay = document.getElementById('noteModalOverlay');
    if (overlay) overlay.addEventListener('click', (ev) => { if (ev.target === overlay) closeNoteModal(); });
  }
  wireNoteModal();

  // ---------------- state ----------------
  let state = { view: 'list', team: 'both', calYear: null, calMonth: null, selectedDate: null };
  try {
    const saved = JSON.parse(localStorage.getItem('koide-sc-prefs') || '{}');
    if (saved.view) state.view = saved.view;
    if (saved.team) state.team = saved.team;
  } catch(e) {}

  function savePrefs(){
    try { localStorage.setItem('koide-sc-prefs', JSON.stringify({ view: state.view, team: state.team })); } catch(e) {}
  }

  function filteredItems(){
    if (state.team === 'both') return items;
    return items.filter(e => e.team === state.team);
  }

  function renderList(){
    const container = document.getElementById('viewList');
    const list = filteredItems();
    if (list.length === 0){
      container.innerHTML = '<div class="empty-state">表示できる予定がありません。</div>';
      return;
    }
    let html = '';
    let curFY = null, curMonth = null;
    let tableOpen = false;
    for (let i = 0; i < list.length; i++){
      const e = list[i];
      const fy = fiscalYear(e.startDate);
      const m = e.startDate.getMonth()+1;
      if (fy !== curFY){
        if (tableOpen){ html += '</div>'; tableOpen = false; }
        html += `<div class="year-heading">${fy}年度</div>`;
        curFY = fy; curMonth = null;
      }
      if (m !== curMonth){
        if (tableOpen){ html += '</div>'; tableOpen = false; }
        const ym = `${e.startDate.getFullYear()}-${pad2(m)}`;
        html += `<div class="month-heading" data-ym="${ym}"><span class="num">${m}</span>月</div>`;
        curMonth = m;
      }
      if (!tableOpen){ html += '<div class="month-table">'; tableOpen = true; }
      const dayKey = ymd(e.startDate);
      const prevKey = i > 0 ? ymd(list[i-1].startDate) : null;
      const nextKey = i < list.length - 1 ? ymd(list[i+1].startDate) : null;
      html += rowHtml(e, { sameAsPrev: dayKey === prevKey, sameAsNext: dayKey === nextKey });
    }
    if (tableOpen) html += '</div>';
    container.innerHTML = html;
  }

  function renderCalGrid(){
    const grid = document.getElementById('calGrid');
    const label = document.getElementById('calLabel');
    const y = state.calYear, m = state.calMonth;
    label.textContent = `${y}年 ${m+1}月`;
    const firstDow = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const today = new Date();
    let html = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
    for (let i=0;i<firstDow;i++) html += `<div class="cal-cell pad"></div>`;
    const teamSet = state.team === 'both' ? ['A','B'] : [state.team];
    for (let d=1; d<=daysInMonth; d++){
      const date = new Date(y,m,d);
      const dayEvents = eventsOnDay(date).filter(e => teamSet.includes(e.team));
      const isToday = ymd(date) === ymd(today);
      const isSel = state.selectedDate === ymd(date);
      const dots = dayEvents.slice(0,4).map(e => `<span class="dot" style="background:var(--team-${e.team === 'A' ? 'a' : 'b'})"></span>`).join('');
      const dateKey = ymd(date);
      const noteText = dbReady === false ? ((STATIC_NOTES && STATIC_NOTES[dateKey]) || '') : (notesMap[dateKey] || '');
      const noteMark = noteText.trim() ? '<span class="note-mark"></span>' : '';
      html += `<button class="cal-cell${isToday?' today':''}${isSel?' selected':''}" data-date="${dateKey}">
        <span class="n">${d}</span>
        <span class="cal-dots">${dots}</span>
        ${noteMark}
      </button>`;
    }
    grid.innerHTML = html;
    grid.querySelectorAll('.cal-cell:not(.pad)').forEach(btn => {
      btn.addEventListener('click', () => {
        state.selectedDate = btn.dataset.date;
        renderCalGrid();
        renderAgenda();
      });
    });
  }

  function renderAgenda(){
    const el = document.getElementById('calAgenda');
    if (!state.selectedDate){ el.innerHTML = ''; return; }
    const dateKey = state.selectedDate;
    const [y,m,d] = dateKey.split('-').map(Number);
    const date = new Date(y,m-1,d);
    const teamSet = state.team === 'both' ? ['A','B'] : [state.team];
    const dayEvents = eventsOnDay(date).filter(e => teamSet.includes(e.team));
    let html = `<div class="agenda-heading"><span class="num">${m}/${d}</span>(${DOW[date.getDay()]})の予定</div>`;
    if (dayEvents.length === 0){
      html += '<div class="empty-state">この日の予定はありません。</div>';
    } else {
      html += dayEvents.map(cardHtml).join('');
    }
    html += noteBoxHtml(dateKey);
    el.innerHTML = html;
    wireNoteBox(dateKey);
  }

  function noteBoxHtml(dateKey){
    if (dbReady === false){
      const staticText = (STATIC_NOTES && STATIC_NOTES[dateKey]) || '';
      if (staticText.trim()){
        return `<div class="note-box note-readonly"><span class="note-label">📌 個人メモ（参照のみ）</span><div class="note-readonly-text">${escapeHtml(staticText)}</div></div>`;
      }
      return `<div class="note-box note-readonly"><span class="note-label">📌 個人メモ</span><span class="note-unavailable">この日の個人メモは登録されていません。</span></div>`;
    }
    const text = notesMap[dateKey] || '';
    return `<div class="note-box">
      <label class="note-label" for="noteInput">📌 個人メモ（サークルスクエアとは別の家庭用メモ・1日1件）</label>
      <textarea id="noteInput" class="note-input" placeholder="例: ゆいちゃん出勤／歯医者 9:00 など">${escapeHtml(text)}</textarea>
      <div class="note-actions">
        <button class="note-save" id="noteSaveBtn">保存</button>
        <span class="note-status" id="noteStatus"></span>
      </div>
    </div>`;
  }

  function wireNoteBox(dateKey){
    const btn = document.getElementById('noteSaveBtn');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      const input = document.getElementById('noteInput');
      const status = document.getElementById('noteStatus');
      const value = input.value;
      status.textContent = '保存中…';
      try {
        const db = await getDb();
        if (!db) throw new Error('no-db');
        await db.doc(`notes/${dateKey}`).set({ text: value, updatedAt: Date.now() });
        status.textContent = '保存しました';
      } catch(e) {
        status.textContent = '保存できませんでした';
      }
      setTimeout(() => { if (status) status.textContent = ''; }, 2500);
    });
  }

  function setView(view){
    state.view = view;
    savePrefs();
    document.getElementById('tabList').setAttribute('aria-selected', String(view==='list'));
    document.getElementById('tabCal').setAttribute('aria-selected', String(view==='cal'));
    document.getElementById('viewList').hidden = view !== 'list';
    document.getElementById('viewCal').hidden = view !== 'cal';
    document.getElementById('jumpTodayBtn').hidden = view !== 'list';
    if (view === 'list') renderList();
    else { renderCalGrid(); renderAgenda(); }
    window.scrollTo(0, 0);
  }

  function jumpToCurrentMonth(){
    const now = new Date();
    const targetYm = `${now.getFullYear()}-${pad2(now.getMonth()+1)}`;
    const headings = Array.from(document.querySelectorAll('#viewList .month-heading'));
    if (headings.length === 0) return;
    let target = headings.find(h => h.dataset.ym === targetYm);
    if (!target) target = headings.find(h => h.dataset.ym > targetYm); // next upcoming month
    if (!target) target = headings[headings.length - 1]; // fall back to most recent past month
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function setTeam(team){
    state.team = team;
    savePrefs();
    document.querySelectorAll('#teamFilters .chip').forEach(c => {
      c.setAttribute('aria-pressed', String(c.dataset.team === team));
    });
    if (state.view === 'list') renderList();
    else { renderCalGrid(); renderAgenda(); }
  }

  document.getElementById('viewList').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.row-summary');
    if (!btn) return;
    const item = btn.closest('.row-item');
    const detail = item.querySelector('.row-detail');
    const expanded = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!expanded));
    detail.hidden = expanded;
    item.classList.toggle('open', !expanded);
  });
  document.getElementById('viewList').addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    const btn = ev.target.closest('.row-summary');
    if (!btn) return;
    ev.preventDefault();
    btn.click();
  });

  document.getElementById('tabList').addEventListener('click', () => setView('list'));
  document.getElementById('tabCal').addEventListener('click', () => setView('cal'));
  document.getElementById('teamFilters').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.chip');
    if (btn && btn.dataset.team) setTeam(btn.dataset.team);
  });
  document.getElementById('jumpTodayBtn').addEventListener('click', jumpToCurrentMonth);
  document.getElementById('calPrev').addEventListener('click', () => {
    state.calMonth--; if (state.calMonth < 0){ state.calMonth = 11; state.calYear--; }
    renderCalGrid();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    state.calMonth++; if (state.calMonth > 11){ state.calMonth = 0; state.calYear++; }
    renderCalGrid();
  });

  // init
  (function init(){
    document.getElementById('updatedAt').textContent = `最終更新 ${LAST_UPDATED}`;
    const now = new Date();
    state.calYear = now.getFullYear();
    state.calMonth = now.getMonth();
    state.selectedDate = ymd(now);
    document.querySelectorAll('#teamFilters .chip').forEach(c => {
      c.setAttribute('aria-pressed', String(c.dataset.team === state.team));
    });
    setView(state.view);
  })();
</script>

</body>
</html>
